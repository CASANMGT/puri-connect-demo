function doReqAct(r,a){

 switch(a){
  case 'claim':r.assignee=(($('#asg')||{}).value)||STAFF[0];r.state='ditugaskan';addTl(r,me,'Diklaim & ditugaskan ke '+r.assignee+'.');toast('Ditugaskan ke '+r.assignee+' (demo).');break;
  case 'sent':{const cn=parseInt((($('#cn')||{}).value)||0,10)||0;const txt=note||CANNED[cn][1];addTl(r,me,'Balasan ke warga: “'+txt+'”');toast('Balasan terkirim ke warga (demo).');break;}
  case 'resolve':if(r.ev&&!($('#ev')||{}).checked){toast('Centang bukti foto dulu — tiket ini wajib bukti.');return;}r.state='selesai';addTl(r,me,(note||'Pekerjaan selesai.')+' — menunggu konfirmasi warga.');break;
  case 'close':r.state='ditutup';addTl(r,'Sistem','Ditutup oleh petugas setelah 48 jam tanpa respons warga (demo).');break;
  case 'payok':r.state='selesai';addTl(r,'Sari — Keuangan','Approve — status Lunas, kuitansi terkirim (demo).');break;
  case 'payno':if(!note){toast('Isi alasan penolakan dulu.');return;}r.state='ditolak';addTl(r,'Sari — Keuangan','Ditolak: '+note);break;
  case 'bkok':r.state='konfirmasi';{const sl=slotFor(r.id);if(sl)sl.state='konfirmasi';}addTl(r,me,'Slot dikonfirmasi & terkirim ke warga (demo).');break;
  case 'bkno':r.state='ditolak';{const sl=slotFor(r.id);if(sl)sl.state='batal';}addTl(r,me,'Ditolak / tawaran slot lain dikirim (demo).');break;
  case 'bkdone':r.state='selesai';{const sl=slotFor(r.id);if(sl)sl.state='selesai';}addTl(r,me,'Pemakaian selesai — fasilitas siap untuk slot berikutnya (demo).');break;
  case 'noteup':{const v=((($('#note2')||{}).value)||'').trim();if(!v){toast('Tulis pembaruan dulu.');return;}addTl(r,me,'Pembaruan: '+v);toast('Pembaruan tercatat & terlihat tim (demo).');break;}

  case 'modskip':r.state='diabaikan';addTl(r,'Citra — Moderator','Laporan diabaikan — tidak melanggar aturan.');break;
  case 'hand':r.state='diserahkan';addTl(r,'Asep — Pos Jaga','Paket diserahkan ke warga — log pos jaga diperbarui.');break;
  case 'remind':addTl(r,me,'Pengingat pengambilan paket terkirim (WA demo).');toast('Pengingat WA terkirim (demo).');break;
  case 'wkok':r.state='disetujui';addTl(r,me,note||'Disetujui — masuk jadwal pengelola (demo).');break;
  case 'wkno':r.state='ditolak';addTl(r,me,'Ditolak: '+(note||'di luar lingkup (demo)'));break;
  case 'wkstart':r.state='dikerjakan';addTl(r,me,'Mulai dikerjakan (demo).');break;
  case 'wkfin':r.state='selesai';addTl(r,me,(note||'Pekerjaan selesai')+' — bukti foto terlampir (demo).');break;
  case 'lpk':r.state='diterima';r.assignee=me;addTl(r,me,'Laporan diterima — lokasi akan dicek.');break;
  case 'fwd':{r.state='diteruskan';addTl(r,me,'Diteruskan ke pengelola sebagai pekerjaan (demo).');const pid='PB-'+(7740+S.reqs.length);S.reqs.unshift({id:pid,type:'pekerjaan',prio:'normal',from:'RT ('+me+')',title:r.title+' — dari laporan '+r.id,desc:(r.desc||'')+' (diteruskan tata kelola)',state:'baru',assignee:null,created:Date.now(),sla:480,csat:null,tl:[{t:Date.now(),by:me,x:'Diteruskan dari laporan warga '+r.id+'.'}]});toast('Diteruskan ke pengelola sebagai '+pid+' (demo).');break;}
  case 'lok':r.state='selesai';addTl(r,me,(note||'Diselesaikan di tingkat RT')+' (demo).');break;
  default:return;
 }
 save();render();
}

  const g={id:'KG-'+(220+S.acts.length),title:t,type:$('#kgJ').value,when:$('#kgW').value.trim()||'Sabtu ini',loc:$('#kgL').value.trim()||'Lingkungan',pic:$('#kgP').value.trim()||meName(),quota:parseInt($('#kgQ').value,10)||30,joined:0,state:'terbit',tl:[{t:Date.now(),by:meName(),x:'Kegiatan dibuat & diumumkan ke warga (demo).'}]};
  S.acts.unshift(g);S.anns.unshift({id:'AN-'+(89+S.anns.length),title:'Kegiatan baru: '+t,aud:'Semua blok',by:meName(),t:Date.now(),body:g.when+' · '+g.loc+' — daftar di aplikasi warga (demo).'});save();toast('Kegiatan terbit & diumumkan (demo).');render();
 };
 $$('#view [data-ka]').forEach(b=>b.onclick=()=>{
  const g=S.acts.find(x=>x.id===b.dataset.id);if(!g)return;
  if(b.dataset.ka==='ann'){S.anns.unshift({id:'AN-'+(89+S.anns.length),title:'Kegiatan: '+g.title,aud:'Semua blok',by:meName(),t:Date.now(),body:g.when+' · '+g.loc+' (demo).'});save();toast('Pengingat kegiatan diumumkan (demo).');}
  if(b.dataset.ka==='done'){g.state='selesai';g.tl.push({t:Date.now(),by:meName(),x:'Kegiatan selesai — terima kasih warga (demo).'});save();toast('Kegiatan ditandai selesai (demo).');}
  render();
 });
}
/* ---------- kerja bakti ---------- */
function renderKerja(){
 const phase=['usul','disetujui','dikerjakan','selesai'];
 const ph=g=>'<div class="phase">'+phase.map(p=>'<span class="st '+(g.state===p?'on':'')+'"><span class="d7"></span>'+STLBL[p]+'</span>').join('')+'</div>';
 const acts=g=>{
  if(g.state==='usul')return '<div class="row" style="margin-top:10px"><button class="btn pri sm grow" data-wa="ok" data-id="'+g.id+'">Setujui</button><button class="btn ghost sm grow" data-wa="no" data-id="'+g.id+'">Tolak</button></div>';
  if(g.state==='disetujui')return '<button class="btn pri sm" style="margin-top:10px;width:100%" data-wa="start" data-id="'+g.id+'">Mulai kerjakan</button>';
  if(g.state==='dikerjakan')return '<div class="row" style="margin-top:10px"><label class="sub"><input type="checkbox" id="pf-'+g.id+'"> Bukti foto</label><button class="btn pri sm grow" data-wa="fin" data-id="'+g.id+'">Selesaikan</button></div>';
  return '<p class="sub" style="margin-top:8px">Selesai '+(g.proof?'dengan bukti foto':'dengan bukti tercatat')+' — laporan balik dikirim (demo).</p>';
 };
 const form='<div class="card"><h3>＋ Usulkan kerja bakti / pekerjaan</h3><label class="fl">Judul</label><input class="inp" id="kbT" placeholder="cth. Bersihkan saluran air Blok B"><label class="fl">Lokasi</label><input class="inp" id="kbL" placeholder="cth. Belakang Blok B"><label class="fl">Lingkup</label><select class="inp" id="kbS"><option>RT</option><option>Pengelola</option></select><label class="fl">Anggaran / catatan</label><input class="inp" id="kbB" placeholder="cth. Kas RT · Rp 250.000 konsumsi"><button class="btn pri" style="margin-top:12px;width:100%" id="kbGo">Usulkan</button><p class="honest">Lingkup pengelola otomatis diteruskan ke console pengelola setelah disetujui (demo).</p></div>';
 const items=S.works.map(g=>'<div class="card"><div class="row"><h3 class="grow" style="margin:0">'+esc(g.title)+'</h3><span class="chip '+(g.scope==='Pengelola'?'acc':'')+'">'+esc(g.scope==='Pengelola'?'Lingkup pengelola':'Lingkup RT')+'</span></div><p class="sub">'+esc(g.loc)+' · PIC: '+esc(g.pic)+'</p><p class="sub mono">'+esc(g.budget)+'</p>'+ph(g)+acts(g)+'</div>').join('');
 $('#view').innerHTML=headHtml('Kerja bakti & aset','Pekerjaan lingkungan',{})+form+items;
 bindHead('t-lain');
 $('#kbGo').onclick=()=>{
  const t=$('#kbT').value.trim();if(!t){toast('Isi judul pekerjaan dulu.');return;}
  S.works.unshift({id:'KB-'+(510+S.works.length),title:t,loc:$('#kbL').value.trim()||'Lingkungan',scope:$('#kbS').value,state:'usul',pic:meName(),budget:$('#kbB').value.trim()||'Belum dianggarkan',proof:false,created:Date.now(),tl:[{t:Date.now(),by:meName(),x:'Diusulkan ke pengurus (demo).'}]});
  save();toast('Usulan dibuat — menunggu persetujuan (demo).');render();
 };
 $$('#view [data-wa]').forEach(b=>b.onclick=()=>{
  const g=S.works.find(x=>x.id===b.dataset.id);if(!g)return;const a=b.dataset.wa;
  if(a==='ok'){g.state='disetujui';g.tl.push({t:Date.now(),by:meName(),x:'Disetujui pengurus (demo).'});if(g.scope==='Pengelola'){const pid='PB-'+(7730+S.reqs.length);S.reqs.unshift({id:pid,type:'pekerjaan',prio:'normal',from:'Tata Kelola ('+meName()+')',title:g.title+' — lingkup pengelola',desc:'Dari kerja bakti '+g.id+' · '+g.loc+'. Anggaran: '+g.budget+'.',state:'baru',assignee:null,created:Date.now(),sla:480,csat:null,tl:[{t:Date.now(),by:meName(),x:'Diteruskan ke console pengelola sebagai '+pid+' (demo).'}]});toast('Disetujui — diteruskan ke pengelola ('+pid+') (demo).');}else toast('Kerja bakti disetujui (demo).');}
  if(a==='no'){g.state='ditolak';g.tl.push({t:Date.now(),by:meName(),x:'Ditolak — perlu usulan ulang (demo).'});toast('Usulan ditolak (demo).');}
  if(a==='start'){g.state='dikerjakan';g.tl.push({t:Date.now(),by:meName(),x:'Mulai dikerjakan warga & PIC (demo).'});toast('Pekerjaan dimulai (demo).');}
  if(a==='fin'){g.state='selesai';g.proof=!!($('#pf-'+g.id)||{}).checked;g.tl.push({t:Date.now(),by:meName(),x:'Selesai'+(g.proof?' — bukti foto terlampir':'')+' (demo).'});if(g.scope==='Pengelola'){const rel=S.reqs.find(r=>r.type==='pekerjaan'&&r.title.indexOf(g.title)>=0&&r.state!=='selesai');if(rel){rel.state='selesai';rel.tl.push({t:Date.now(),by:meName(),x:'Ditutup: kerja bakti '+g.id+' melaporkan selesai (demo).'});}}toast('Pekerjaan selesai — laporan balik dikirim (demo).');}
  save();render();
 });
}
/* ---------- petisi ---------- */
function renderPet(){
 let h=headHtml('Petisi & proyek','Pantau fase (demo)',{back:true});
 h+='<div class="card"><span class="pill">Kuorum: 40% partisipasi unit (demo)</span></div>';
 h+=S.pets.map(p=>'<div class="card"><div class="row"><h3 class="grow" style="margin:0">'+esc(p.title)+'</h3><span class="chip acc">'+esc(p.phase)+'</span></div><p class="sub">'+esc(p.prog)+'</p><p class="sub mono">Update: '+ago(p.up)+'</p><div class="row" style="margin-top:10px"><button class="btn ghost sm grow" data-pa="det" data-id="'+p.id+'">Buka detail</button><button class="btn sm grow" data-pa="ping" data-id="'+p.id+'">Ingatkan tahap</button></div></div>').join('');
 h+='<p class="honest" style="margin:12px 16px">Console hanya memantau fase; tanda tangan, voting, dan detail proyek dikelola di aplikasi warga (demo).</p>';
 $('#view').innerHTML=h;bindHead('t-lain');
 $$('#view [data-pa]').forEach(b=>b.onclick=()=>{
  const p=S.pets.find(x=>x.id===b.dataset.id);if(!p)return;
  if(b.dataset.pa==='det')toast(p.id+' — '+p.phase+': '+p.prog+' (demo).');
  else{S.anns.unshift({id:'AN-'+(89+S.anns.length),title:'Pengingat: '+p.title,aud:'Semua blok',by:meName(),t:Date.now(),body:'Tahap saat ini: '+p.phase+'. '+p.prog+' (demo).'});save();toast('Pengingat tahap diumumkan (demo).');}
 });
}
/* ---------- pengumuman ---------- */
function renderUmum(){
 let h=headHtml('Pengumuman','Broadcast warga',{back:true});
 h+='<div class="card"><h3>＋ Pengumuman warga</h3><label class="fl">Judul</label><input class="inp" id="anT" placeholder="cth. Gotong royong Minggu pagi"><label class="fl">Audiens</label><select class="inp" id="anA"><option>Semua blok</option><option>Blok A</option><option>Blok B</option><option>Blok C</option><option>Blok D</option><option>Blok A &amp; B</option></select><label class="fl">Isi singkat</label><input class="inp" id="anB" placeholder="cth. Berkumpul 07.00 di taman (demo)"><button class="btn pri" style="margin-top:12px;width:100%" id="anGo">Terbitkan pengumuman</button><p class="honest">Muncul di Beranda warga & notifikasi (demo).</p></div>';
 h+='<div class="card"><h3>Riwayat</h3>'+S.anns.map(a=>'<div style="border-top:1px solid rgba(32,24,18,.07);padding:9px 0"><div class="row"><b class="grow" style="font-size:14.5px">'+esc(a.title)+'</b><span class="chip">'+esc(a.aud)+'</span></div><p class="sub" style="margin:3px 0 0">'+esc(a.body)+'</p><p class="sub mono" style="margin:2px 0 0">'+esc(a.by)+' · '+fmtT(a.t)+'</p></div>').join('')+'</div>';
 $('#view').innerHTML=h;bindHead('t-lain');
 $('#anGo').onclick=()=>{
  const t=$('#anT').value.trim();if(!t){toast('Isi judul pengumuman dulu.');return;}
  S.anns.unshift({id:'AN-'+(89+S.anns.length),title:t,aud:$('#anA').value,by:meName(),t:Date.now(),body:$('#anB').value.trim()||'(demo)'});
  save();toast('Pengumuman terbit ke warga (demo).');render();
 };
}

/* ---------- dispatcher & boot ---------- */
function render(){
 try{
  const ws=wsOf(VH);let ch=false;
  if(S.ws!==ws){S.ws=ws;ch=true;}
  if(!ROLES.find(r=>r[0]===S.role&&r[2]===ws)){S.role=ws==='B'?'rt':'cs';ch=true;}
  if(ch)save();
  renderTabs();
  if(VH.startsWith('d-'))renderDetail(VH.slice(2));
  else if(VH==='i-booking')renderBooking();
  else if(Object.prototype.hasOwnProperty.call(FILT,VH))renderList(VH);
  else if(VH==='i-sos')renderSos();
  else if(VH==='i-kinerja')renderKin();
  else if(VH==='i-lain'||VH==='t-lain')renderLain();
  else if(VH==='i-set')renderSet();
  else if(VH==='t-set')renderSetB();
  else if(VH==='t-kegiatan')renderKeg();
  else if(VH==='t-kerja')renderKerja();
  else if(VH==='t-petisi')renderPet();
  else if(VH==='t-umum')renderUmum();
  else {VH=S.ws==='B'?'t-lapor':'i-inbox';location.hash=VH;render();return;}
  $('#view').scrollTop=0;
  document.body.dataset.route=VH;
 }catch(err){
  document.body.dataset.err=(err&&err.message)||String(err);
  const v=$('#view');
  if(v)v.innerHTML='<div class="empty">Terjadi kesalahan pada demo: '+esc((err&&err.message)||err)+'</div>';
 }
}
window.addEventListener('hashchange',()=>{const h=(location.hash||'#i-inbox').slice(1);if(h!==VH){BACK=VH;VH=h;}render();});
try{
 render();
 document.body.dataset.boot='ok';
}catch(e){document.body.dataset.booterr=(e&&e.message)||String(e);}
}catch(e){document.body.dataset.booterr='outer: '+((e&&e.message)||String(e));}
</script>
</body>
