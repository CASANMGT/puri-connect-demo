<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puri Connect — Console Pengelola &amp; Tata Kelola (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Karla:wght@400;500;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E8;--surf:#FFFDF8;--ink:#201812;--mut:#7A6B59;
  --line:rgba(32,24,18,.16);--line2:rgba(32,24,18,.10);
  --acc:#4B39A6;--accT:rgba(75,57,166,.08);
  --good:#2E6B4E;--goodT:rgba(46,107,78,.09);
  --warn:#C9862B;--warnt:#9A6415;--warnT:rgba(201,134,43,.12);
  --bad:#B23220;--badT:rgba(178,50,32,.09);
  --r-card:16px;--r-btn:11px;--r-in:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Karla,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5}
b,strong{font-weight:700}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0}
.mono{font-family:"Spline Sans Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* ---------- sidebar ---------- */
.side{background:var(--ink);color:#F2EBDD;display:flex;flex-direction:column;gap:14px;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand b{font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:500;display:block;letter-spacing:.2px}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B2A18B;font-family:"Spline Sans Mono",monospace}
.wssw{display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(246,241,232,.14);border-bottom:1px solid rgba(246,241,232,.14);padding:12px 0}
.wssw button{background:transparent;border:1px solid rgba(246,241,232,.22);color:#F2EBDD;border-radius:var(--r-btn);padding:9px 11px;text-align:left;font-weight:500;font-size:14px}
.wssw button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
nav a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;color:#E4D9C6;text-decoration:none;font-size:14.5px;border-left:2px solid transparent}
nav a .d7{width:7px;height:7px;border-radius:50%;background:#8f806c;flex:0 0 auto}
nav a:hover{background:rgba(246,241,232,.06)}
nav a.on{background:rgba(246,241,232,.09);color:#fff;border-left-color:#9C8CF2}
nav a.on .d7{background:#9C8CF2}
nav a .cnt{margin-left:auto;font-family:"Spline Sans Mono",monospace;font-size:11.5px;background:rgba(246,241,232,.14);border-radius:999px;padding:1px 7px}
nav .sec{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8f806c;padding:10px 10px 2px;font-family:"Spline Sans Mono",monospace}
.user{margin-top:auto;border-top:1px solid rgba(246,241,232,.14);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.user label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#B2A18B;font-family:"Spline Sans Mono",monospace}
.user select{background:#2A221C;color:#F2EBDD;border:1px solid rgba(246,241,232,.22);border-radius:var(--r-in);padding:8px 9px;font:inherit;font-size:13.5px}
.rst{background:transparent;border:1px solid rgba(246,241,232,.22);border-radius:var(--r-btn);color:#D8CBB6;padding:7px 10px;font-size:12.5px}
/* ---------- main ---------- */
.main{background:var(--paper);min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:18px;padding:16px 26px;background:var(--surf);border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:5}
.top h1{font-size:23px}
.top .sub{margin:1px 0 0;color:var(--mut);font-size:13.5px}
.tools{margin-left:auto;display:flex;align-items:center;gap:12px}
#q{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-in);padding:8px 12px;font:inherit;font-size:13.5px;width:230px;color:var(--ink)}
.pill{font-family:"Spline Sans Mono",monospace;font-size:10.5px;letter-spacing:.1em;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:4px 10px;white-space:nowrap}
.clock{font-family:"Spline Sans Mono",monospace;font-size:13px;color:var(--mut)}
.views{padding:22px 26px 60px;max-width:1240px;width:100%}
/* ---------- generic ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:"Spline Sans Mono",monospace;font-size:11px;letter-spacing:.02em;border:1px solid var(--line);border-radius:999px;padding:2.5px 9px;color:var(--mut);background:var(--surf);white-space:nowrap}
.chip.acc{border-color:rgba(75,57,166,.4);color:var(--acc);background:var(--accT)}
.chip.good{border-color:rgba(46,107,78,.4);color:var(--good);background:var(--goodT)}
.chip.warn{border-color:rgba(201,134,43,.45);color:var(--warnt);background:var(--warnT)}
.chip.bad{border-color:rgba(178,50,32,.4);color:var(--bad);background:var(--badT)}
.d7{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.d7.g{background:var(--good)}.d7.w{background:var(--warn)}.d7.b{background:var(--bad)}.d7.n{background:#B9AB96}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:var(--r-btn);padding:8px 13px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:rgba(32,24,18,.3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#3E2E8F}
.btn.bad{color:var(--bad);border-color:rgba(178,50,32,.35)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surf);border:1px solid var(--line2);border-radius:var(--r-card);padding:16px 18px}
.card h3{font-size:17px;margin-bottom:6px}
.sub{color:var(--mut);font-size:13.5px;margin:2px 0}
.hair{border-top:1px solid var(--line2)}
input[type=text],input[type=number],textarea,select.inp{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-in);padding:9px 11px;font:inherit;font-size:14px;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
label.fl{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:10px 0 4px;font-family:"Spline Sans Mono",monospace}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
/* ---------- inbox ---------- */
.inbox{display:grid;grid-template-columns:392px 1fr;gap:18px;align-items:start}
.rlist{display:flex;flex-direction:column;gap:8px}
.item{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line2);border-radius:14px;padding:11px 13px}
.item:hover{border-color:var(--line)}
.item.sel{border-color:var(--acc);background:linear-gradient(0deg,var(--accT),var(--accT)),var(--surf)}
.item .t1{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.item .t1 b{font-size:14px}
.item .t2{color:var(--mut);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.fchips button{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--mut)}
.fchips button.on{background:var(--ink);border-color:var(--ink);color:#F6F1E8}
.sla{height:6px;border-radius:999px;background:var(--line2);overflow:hidden;margin-top:8px}
.sla i{display:block;height:100%;border-radius:999px}
.tl{display:flex;flex-direction:column;gap:0;margin-top:6px}
.tl .ev{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line2)}
.tl .ev:first-child{border-top:0}
.tl .ev .d7{margin-top:6px}
.tl .ev small{color:var(--mut);font-size:12px;font-family:"Spline Sans Mono",monospace}
.acts{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line2);padding-top:12px;margin-top:12px}
.acts .row{gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin-top:8px}
.kv .k{color:var(--mut)}
.mono-num{font-family:"Spline Sans Mono",monospace}
/* ---------- boards ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.sos-card{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surf);padding:14px 16px}
.sos-card.alarm{border-color:rgba(178,50,32,.55);background:linear-gradient(0deg,var(--badT),var(--badT)),var(--surf)}
.stat{border:1px solid var(--line2);border-radius:var(--r-card);background:var(--surf);padding:14px 16px}
.stat .n{font-family:"Spline Sans Mono",monospace;font-size:30px;line-height:1.1}
.stat .l{color:var(--mut);font-size:12.5px;margin-top:2px}
.bar{height:8px;border-radius:999px;background:var(--line2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px}
table.plain{width:100%;border-collapse:collapse;font-size:13.5px}
table.plain th{ text-align:left;font-family:"Spline Sans Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line)}
table.plain td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.phase{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.phase .st{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
.phase .st.on{color:var(--ink);font-weight:700}
.phase .st.on .d7{background:var(--acc)}
.phase .ln{width:18px;height:1px;background:var(--line)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#F2EBDD;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s ease-out;font-weight:500;max-width:80vw;z-index:50}
#toast.on{opacity:1}
.empty{border:1px dashed var(--line);border-radius:var(--r-card);padding:26px;text-align:center;color:var(--mut)}
.honest{font-size:12.5px;color:var(--mut);border-top:1px solid var(--line2);margin-top:14px;padding-top:10px}
@media (max-width:1120px){.inbox{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}.app{grid-template-columns:210px 1fr}}
</style>
</head>

</div>

/* ---------- kegiatan (RT/RW) ---------- */
function renderKeg(){
 const items=S.acts.map(g=>{
  const pct=Math.min(100,Math.round(g.joined/g.quota*100));
  return '<div class="card"><div class="row"><h3 class="grow">'+esc(g.title)+'</h3>'+stChip(g.state)+'</div><p class="sub">'+esc(g.type)+' · '+esc(g.when)+' · '+esc(g.loc)+'</p><p class="sub">PIC: '+esc(g.pic)+' · Kuota '+g.joined+'/'+g.quota+'</p><div class="bar"><i style="width:'+pct+'%"></i></div><div class="tl">'+g.tl.slice().reverse().map(e=>'<div class="ev"><span class="d7 n"></span><div><div>'+esc(e.x)+'</div><small>'+esc(e.by)+' · '+fmtT(e.t)+'</small></div></div>').join('')+'</div><div class="acts"><div class="row"><button class="btn" data-ka="ann" data-id="'+g.id+'">Umumkan ulang</button><button class="btn pri" data-ka="done" data-id="'+g.id+'">Tandai selesai</button></div></div></div>';
 }).join('');
 const form='<div class="card" style="margin-bottom:16px"><h3>＋ Buat kegiatan</h3><div class="grid2"><div><label class="fl">Nama kegiatan</label><input class="inp" id="kgT" placeholder="cth. Kerja bakti taman Blok A"><label class="fl">Jenis</label><select class="inp" id="kgJ"><option>Kerja bakti</option><option>Olahraga</option><option>Sosial</option><option>Keamanan</option></select></div><div><label class="fl">Waktu</label><input class="inp" id="kgW" placeholder="cth. Sab 8 Nov · 07.00"><label class="fl">Tempat</label><input class="inp" id="kgL" placeholder="cth. Taman Blok A"></div></div><div class="grid2"><div><label class="fl">PIC</label><input class="inp" id="kgP" value="'+esc(meName())+'"></div><div><label class="fl">Kuota peserta</label><input class="inp" id="kgQ" inputmode="numeric" value="30"></div></div><div class="row" style="margin-top:12px"><button class="btn pri" id="kgGo">Terbitkan + umumkan ke warga</button><span class="sub">Terbit = tampil di aplikasi warga & daftar pengumuman (demo).</span></div></div>';
 $('#view').innerHTML=form+'<div class="grid2">'+items+'</div>';
 $('#kgGo').onclick=()=>{
  const t=$('#kgT').value.trim();if(!t){toast('Isi nama kegiatan dulu.');return;}
  const g={id:'KG-'+(220+S.acts.length),title:t,type:$('#kgJ').value,when:$('#kgW').value.trim()||'Sabtu ini',loc:$('#kgL').value.trim()||'Lingkungan',pic:$('#kgP').value.trim()||meName(),quota:parseInt($('#kgQ').value,10)||30,joined:0,state:'terbit',tl:[{t:Date.now(),by:meName(),x:'Kegiatan dibuat & diumumkan ke warga (demo).'}]};
  S.acts.unshift(g);S.anns.unshift({id:'AN-'+(89+S.anns.length),title:'Kegiatan baru: '+t,aud:'Semua blok',by:meName(),t:Date.now(),body:g.when+' · '+g.loc+' — daftar di aplikasi warga (demo).'});save();toast('Kegiatan terbit & diumumkan (demo).');render();
 };
 $$('#view [data-ka]').forEach(b=>b.onclick=()=>{
  const g=S.acts.find(x=>x.id===b.dataset.id);if(!g)return;
  if(b.dataset.ka==='ann'){S.anns.unshift({id:'AN-'+(89+S.anns.length),title:'Kegiatan: '+g.title,aud:'Semua blok',by:meName(),t:Date.now(),body:g.when+' · '+g.loc+' (demo).'});save();toast('Pengingat kegiatan diumumkan (demo).');}
  if(b.dataset.ka==='done'){g.state='selesai';g.tl.push({t:Date.now(),by:meName(),x:'Kegiatan selesai — terima kasih warga (demo).'});save();toast('Kegiatan ditandai selesai (demo).');}
  render();
 });
}
/* ---------- kerja bakti & aset ---------- */
function renderKerja(){
 const phase=['usul','disetujui','dikerjakan','selesai'];
 const ph=g=>['<div class="phase">'+phase.map((p,i)=>'<span class="st '+(g.state===p?'on':'')+'"><span class="d7"></span>'+STLBL[p]+'</span>'+(i<phase.length-1?'<span class="ln"></span>':'')).join('')+'</div>'].join('');
 const acts=g=>{
  if(g.state==='usul')return '<div class="row"><button class="btn pri" data-wa="ok" data-id="'+g.id+'">Setujui</button><button class="btn" data-wa="no" data-id="'+g.id+'">Tolak</button></div>';
  if(g.state==='disetujui')return '<div class="row"><button class="btn pri" data-wa="start" data-id="'+g.id+'">Mulai kerjakan</button></div>';
  if(g.state==='dikerjakan')return '<div class="row"><label class="sub"><input type="checkbox" id="pf-'+g.id+'"> Bukti foto (demo)</label><button class="btn pri" data-wa="fin" data-id="'+g.id+'">Selesaikan + bukti</button></div>';
  return '<p class="sub">Selesai '+(g.proof?'dengan bukti foto':'dengan bukti tercatat')+' — laporan balik ke RT &amp; warga (demo).</p>';
 };
 const items=S.works.map(g=>'<div class="card"><div class="row"><h3 class="grow">'+esc(g.title)+'</h3><span class="chip '+(g.scope==='Pengelola'?'acc':'')+'">'+esc(g.scope==='Pengelola'?'Lingkup pengelola':'Lingkup RT')+'</span></div><p class="sub">'+esc(g.loc)+' · PIC: '+esc(g.pic)+'</p><p class="sub mono">Anggaran: '+esc(g.budget)+'</p>'+ph(g)+'<div class="acts">'+acts(g)+'</div></div>').join('');
 const form='<div class="card" style="margin-bottom:16px"><h3>＋ Usulkan kerja bakti / pekerjaan</h3><div class="grid2"><div><label class="fl">Judul pekerjaan</label><input class="inp" id="kbT" placeholder="cth. Bersihkan saluran air Blok B"><label class="fl">Lokasi</label><input class="inp" id="kbL" placeholder="cth. Belakang Blok B"></div><div><label class="fl">Lingkup</label><select class="inp" id="kbS"><option>RT</option><option>Pengelola</option></select><label class="fl">Anggaran / catatan</label><input class="inp" id="kbB" placeholder="cth. Kas RT · Rp 250.000 konsumsi"></div></div><div class="row" style="margin-top:12px"><button class="btn pri" id="kbGo">Usulkan</button><span class="sub">Lingkup pengelola otomatis diteruskan ke console pengelola setelah disetujui (demo).</span></div></div>';
 $('#view').innerHTML=form+'<div class="grid2">'+items+'</div>';
 $('#kbGo').onclick=()=>{
  const t=$('#kbT').value.trim();if(!t){toast('Isi judul pekerjaan dulu.');return;}
  S.works.unshift({id:'KB-'+(510+S.works.length),title:t,loc:$('#kbL').value.trim()||'Lingkungan',scope:$('#kbS').value,state:'usul',pic:meName(),budget:$('#kbB').value.trim()||'Belum dianggarkan',proof:false,created:Date.now(),tl:[{t:Date.now(),by:meName(),x:'Diusulkan ke pengurus (demo).'}]});
  save();toast('Usulan dibuat — menunggu persetujuan (demo).');render();
 };
 $$('#view [data-wa]').forEach(b=>b.onclick=()=>{
  const g=S.works.find(x=>x.id===b.dataset.id);if(!g)return;const a=b.dataset.wa;
  if(a==='ok'){g.state='disetujui';g.tl.push({t:Date.now(),by:meName(),x:'Disetujui pengurus (demo).'});if(g.scope==='Pengelola'){const pid='PB-'+(7730+S.reqs.length);S.reqs.unshift({id:pid,type:'pekerjaan',prio:'normal',from:'Tata Kelola ('+meName()+')',title:g.title+' — lingkup pengelola',desc:'Dari kerja bakti '+g.id+' · '+g.loc+'. Anggaran: '+g.budget+'.',state:'baru',assignee:null,created:Date.now(),sla:480,csat:null,tl:[{t:Date.now(),by:meName(),x:'Diteruskan ke console pengelola sebagai '+pid+' (demo).'}]});toast('Disetujui — diteruskan ke pengelola ('+pid+') (demo).');}else toast('Kerja bakti disetujui (demo).');}
  if(a==='no'){g.state='ditolak';g.tl.push({t:Date.now(),by:meName(),x:'Ditolak — perlu usulan ulang dengan anggaran (demo).'});toast('Usulan ditolak (demo).');}
  if(a==='start'){g.state='dikerjakan';g.tl.push({t:Date.now(),by:meName(),x:'Mulai dikerjakan warga & PIC (demo).'});toast('Pekerjaan dimulai (demo).');}
  if(a==='fin'){g.state='selesai';g.proof=!!($('#pf-'+g.id)||{}).checked;g.tl.push({t:Date.now(),by:meName(),x:'Selesai'+(g.proof?' — bukti foto terlampir':'')+' (demo).'});if(g.scope==='Pengelola'){const rel=S.reqs.find(r=>r.type==='pekerjaan'&&r.title.indexOf(g.title)>=0&&r.state!=='selesai');if(rel){rel.state='selesai';rel.tl.push({t:Date.now(),by:meName(),x:'Ditutup: kerja bakti '+g.id+' melaporkan selesai (demo).'});}}toast('Pekerjaan selesai — laporan balik dikirim (demo).');}
  save();render();
 });
}
/* ---------- petisi (pantau fase) ---------- */

 let h='<div class="row" style="margin-bottom:12px"><span class="pill">Kuorum sesuai keputusan pengurus: 40% partisipasi unit (demo)</span></div><div class="grid2">'+
 S.pets.map(p=>'<div class="card"><div class="row"><h3 class="grow">'+esc(p.title)+'</h3><span class="chip acc">'+esc(p.phase)+'</span></div><p class="sub">'+esc(p.prog)+'</p><p class="sub mono">Update: '+ago(p.up)+'</p><div class="acts"><div class="row"><button class="btn" data-pa="det" data-id="'+p.id+'">Buka detail</button><button class="btn" data-pa="ping" data-id="'+p.id+'">Ingatkan tahap</button></div></div></div>').join('')+'</div>'+
 '<p class="honest">Console hanya memantau fase; tanda tangan, voting, dan detail proyek dikelola di aplikasi warga &amp; lembar keputusan pengurus (demo).</p>';
 $('#view').innerHTML=h;
 $$('#view [data-pa]').forEach(b=>b.onclick=()=>{
  const p=S.pets.find(x=>x.id===b.dataset.id);if(!p)return;
  if(b.dataset.pa==='det')toast(p.id+' — '+p.phase+': '+p.prog+' (demo).');
  else{S.anns.unshift({id:'AN-'+(89+S.anns.length),title:'Pengingat: '+p.title,aud:'Semua blok',by:meName(),t:Date.now(),body:'Tahap saat ini: '+p.phase+'. '+p.prog+' (demo).'});save();toast('Pengingat tahap diumumkan ke warga (demo).');}
 });
}
/* ---------- pengumuman ---------- */
function renderUmum(){
 let h='<div class="card" style="margin-bottom:16px"><h3>＋ Pengumuman warga</h3><label class="fl">Judul</label><input class="inp" id="anT" placeholder="cth. Gotong royong Minggu pagi"><div class="grid2"><div><label class="fl">Audiens</label><select class="inp" id="anA"><option>Semua blok</option><option>Blok A</option><option>Blok B</option><option>Blok C</option><option>Blok D</option><option>Blok A &amp; B</option></select></div><div><label class="fl">Isi singkat</label><input class="inp" id="anB" placeholder="cth. Berkumpul 07.00 di taman, alat disediakan (demo)"></div></div><div class="row" style="margin-top:12px"><button class="btn pri" id="anGo">Terbitkan pengumuman</button><span class="sub">Muncul di kartu Beranda warga &amp; notifikasi (demo).</span></div></div>';
 h+='<div class="card"><h3>Riwayat pengumuman</h3><table class="plain"><tr><th>Waktu</th><th>Judul</th><th>Audiens</th><th>Oleh</th></tr>'+S.anns.map(a=>'<tr><td class="mono">'+fmtT(a.t)+'</td><td><b>'+esc(a.title)+'</b><div class="sub">'+esc(a.body)+'</div></td><td>'+esc(a.aud)+'</td><td>'+esc(a.by)+'</td></tr>').join('')+'</table></div>';
 $('#view').innerHTML=h;
 $('#anGo').onclick=()=>{
  const t=$('#anT').value.trim();if(!t){toast('Isi judul pengumuman dulu.');return;}
  S.anns.unshift({id:'AN-'+(89+S.anns.length),title:t,aud:$('#anA').value,by:meName(),t:Date.now(),body:$('#anB').value.trim()||'(demo)'});
  save();toast('Pengumuman terbit ke warga (demo).');render();
 };

/* ---------- inbox detail actions ---------- */
function doReqAct(r,a){
 const me=meName(),note=(($('#note')||{}).value||'').trim();
 switch(a){
  case 'claim':r.assignee=(($('#asg')||{}).value)||STAFF[0];r.state='ditugaskan';addTl(r,me,'Diklaim & ditugaskan ke '+r.assignee+'.');toast('Ditugaskan ke '+r.assignee+' (demo).');break;
  case 'sent':{const cn=parseInt((($('#cn')||{}).value)||0,10)||0;const txt=note||CANNED[cn][1];addTl(r,me,'Balasan ke warga: “'+txt+'”');toast('Balasan terkirim ke warga (demo).');break;}
  case 'resolve':if(r.ev&&!($('#ev')||{}).checked){toast('Centang bukti foto dulu — tiket ini wajib bukti.');return;}r.state='selesai';addTl(r,me,(note||'Pekerjaan selesai.')+' — menunggu konfirmasi warga.');break;
  case 'close':r.state='ditutup';addTl(r,'Sistem','Ditutup oleh petugas setelah 48 jam tanpa respons warga (demo).');break;
  case 'payok':r.state='selesai';addTl(r,'Sari — Keuangan','Approve — status Lunas, kuitansi terkirim (demo).');break;
  case 'payno':if(!note){toast('Isi alasan penolakan dulu.');return;}r.state='ditolak';addTl(r,'Sari — Keuangan','Ditolak: '+note);break;
  case 'bkok':r.state='konfirmasi';addTl(r,me,'Slot dikonfirmasi & terkirim ke warga (demo).');break;
  case 'bkno':r.state='ditolak';addTl(r,me,'Ditolak / tawaran slot lain dikirim (demo).');break;
  case 'moddel':r.state='dihapus';addTl(r,'Citra — Moderator','Postingan dihapus — aturan: jual-beli hanya di Bursa (demo).');break;
  case 'modwarn':r.state='ditegur';addTl(r,'Citra — Moderator','Penulis ditegur via pesan sistem (demo).');break;
  case 'modskip':r.state='diabaikan';addTl(r,'Citra — Moderator','Laporan diabaikan — tidak melanggar aturan.');break;
  case 'hand':r.state='diserahkan';addTl(r,'Asep — Pos Jaga','Paket diserahkan ke warga — log pos jaga diperbarui.');break;
  case 'remind':addTl(r,me,'Pengingat pengambilan paket terkirim (WA demo).');toast('Pengingat WA terkirim (demo).');break;
  case 'wkok':r.state='disetujui';addTl(r,me,note||'Disetujui — masuk jadwal pengelola (demo).');break;
  case 'wkno':r.state='ditolak';addTl(r,me,'Ditolak: '+(note||'di luar lingkup (demo)'));break;
  case 'wkstart':r.state='dikerjakan';addTl(r,me,'Mulai dikerjakan (demo).');break;
  case 'wkfin':r.state='selesai';addTl(r,me,(note||'Pekerjaan selesai')+' — bukti foto terlampir (demo).');break;
  case 'lpk':r.state='diterima';r.assignee=me;addTl(r,me,'Laporan diterima — lokasi akan dicek.');break;
  case 'fwd':{r.state='diteruskan';addTl(r,me,'Diteruskan ke pengelola sebagai pekerjaan (demo).');const pid='PB-'+(7740+S.reqs.length);S.reqs.unshift({id:pid,type:'pekerjaan',prio:'normal',from:'RT ('+me+')',title:r.title+' — dari laporan '+r.id,desc:(r.desc||'')+' (diteruskan tata kelola)',state:'baru',assignee:null,created:Date.now(),sla:480,csat:null,tl:[{t:Date.now(),by:me,x:'Diteruskan dari laporan warga '+r.id+'.'}]});toast('Diteruskan ke pengelola sebagai '+pid+' (demo).');break;}
  case 'lok':r.state='selesai';addTl(r,me,(note||'Diselesaikan di tingkat RT')+' (demo).');break;
  default:return;
 }
 save();render();
}
/* ---------- router ---------- */
function render(){
 const nf=navFind(VH);
 if(nf.it[0]!==VH){VH=nf.it[0];location.hash=VH;}
 if(S.ws!==nf.ws){S.ws=nf.ws;save();}
 const roleOk=ROLES.find(r=>r[0]===S.role&&r[2]===S.ws);
 if(!roleOk){S.role=S.ws==='B'?'rt':'cs';save();}
 $('#role').value=S.role;
 $('#ttl').textContent=nf.it[1];$('#sub').textContent=nf.it[2];
 renderNav();
 switch(VH){
  case 'i-inbox':case 'i-tiket':case 'i-bayar':case 'i-booking':case 'i-pekerjaan':case 'i-moderasi':case 'i-kiriman':case 't-lapor':{
   renderInbox();
   const sel=S.sel[VH]?getReq(S.sel[VH]):null;
   if(sel)$$('#view .acts [data-a]').forEach(b=>b.onclick=()=>doReqAct(sel,b.dataset.a));
   break;
  }
  case 'i-sos':renderSos();break;
  case 'i-kinerja':renderKin();break;
  case 'i-set':renderSet();break;
  case 't-kegiatan':renderKeg();break;
  case 't-kerja':renderKerja();break;
  case 't-petisi':renderPet();break;
  case 't-umum':renderUmum();break;
  case 't-set':renderSetB();break;
  default:VH='i-inbox';render();return;
 }
}
/* ---------- init ---------- */
function boot(){
 $('#role').innerHTML=ROLES.map(r=>'<option value="'+r[0]+'">'+esc(r[1])+' · '+esc(r[3])+'</option>').join('');
 $('#role').value=S.role;
 $('#prop').value=S.prop;
 $('#role').onchange=()=>{S.role=$('#role').value;const r=ROLES.find(x=>x[0]===S.role);S.ws=r[2];save();go(S.ws==='A'?'i-inbox':'t-lapor');toast('Masuk sebagai '+r[1]+' — ruang kerja '+r[3]+' (demo).');};
 $('#prop').onchange=()=>{S.prop=$('#prop').value;save();toast('Properti aktif: '+S.prop+' (demo).');render();};
 $('#rst').onclick=()=>{if(!confirm('Reset data demo console ke kondisi awal?'))return;localStorage.removeItem('puri_console_v1');S=seed();save();go('i-inbox');toast('Data demo direset.');};
 $('#q').addEventListener('input',()=>{if(/^(i-|t-lapor)/.test(VH))render();});
 setInterval(()=>{$('#clk').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});},1000);
 $('#clk').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==VH){VH=h;render();}});
 render();
 document.body.setAttribute('data-boot','ok');
}
try{boot();}catch(err){document.body.setAttribute('data-booterr',String(err&&err.message||err).slice(0,160));}
}catch(err){document.body.setAttribute('data-booterr',String(err&&err.message||err).slice(0,160));}
window.addEventListener('error',e=>document.body.setAttribute('data-err',String(e.message||'').slice(0,160)));
</script>
